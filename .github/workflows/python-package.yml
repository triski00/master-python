# Comprueba el código en cada push y pull request a main:
#   1. Lint con flake8
#   2. Tests de 20-proyecto-python (pytest)
#   3. Tests de ProyectoDjango2 (manage.py test)

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 6.0 requiere Python 3.12 o superior
        python-version: ["3.12", "3.13"]

    env:
      # Clave solo para CI, sin valor real
      DJANGO_SECRET_KEY: clave-solo-para-ci

    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        pip install -r requirements.txt
    - name: Lint con flake8 (errores graves)
      run: |
        # Detiene el job si hay errores de sintaxis o nombres sin definir
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Lint con flake8 (avisos de estilo)
      run: |
        # exit-zero: solo informa, no rompe el job
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Tests de 20-proyecto-python (pytest)
      run: pytest
    - name: Tests de ProyectoDjango2
      run: python manage.py test
      working-directory: 22-django/ProyectoDjango2
